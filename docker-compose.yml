services:
  postgres:
      image: postgres:16
      environment:
        POSTGRES_DB: lakekeeper
        POSTGRES_USER: lakekeeper
        POSTGRES_PASSWORD: ${LAKEKEEPER_DB_PASSWORD:-devpassword}
      volumes: ["pg_data:/var/lib/postgresql/data"]
      healthcheck:
        test: ["CMD-SHELL", "pg_isready -U lakekeeper"]
        interval: 5s
        retries: 5

  lakekeeper-migrate:
      image: quay.io/lakekeeper/catalog:latest
      command: ["migrate"]
      depends_on:
        postgres:
          condition: service_healthy
      environment:
        LAKEKEEPER__PG_ENCRYPTION_KEY: "nexus-lakekeeper-key-32chars-ok!"
        LAKEKEEPER__PG_DATABASE_URL_READ: "postgresql://lakekeeper:${LAKEKEEPER_DB_PASSWORD:-devpassword}@postgres/lakekeeper"
        LAKEKEEPER__PG_DATABASE_URL_WRITE: "postgresql://lakekeeper:${LAKEKEEPER_DB_PASSWORD:-devpassword}@postgres/lakekeeper"

  lakekeeper:
      image: quay.io/lakekeeper/catalog:latest
      ports: ["8181:8181"]
      command: ["serve"]
      depends_on:
        lakekeeper-migrate:
          condition: service_completed_successfully
      environment:
        LAKEKEEPER__PG_ENCRYPTION_KEY: "nexus-lakekeeper-key-32chars-ok!"
        LAKEKEEPER__PG_DATABASE_URL_READ: "postgresql://lakekeeper:${LAKEKEEPER_DB_PASSWORD:-devpassword}@postgres/lakekeeper"
        LAKEKEEPER__PG_DATABASE_URL_WRITE: "postgresql://lakekeeper:${LAKEKEEPER_DB_PASSWORD:-devpassword}@postgres/lakekeeper"
      healthcheck:
        test: ["CMD", "curl", "-sf", "http://localhost:8181/health"]
        interval: 10s
        timeout: 5s
        retries: 10
        start_period: 10s
        

  kafka:
    image: apache/kafka:4.0.0
    ports:
      - "9092:9092"             
      - "19092:19092"           
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:19092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-broker-api-versions.sh", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  schema-registry:
    image: confluentinc/cp-schema-registry:7.6.0
    ports: ["8081:8081"]
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: kafka:9092
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
      SCHEMA_REGISTRY_LOG4J_ROOT_LOGLEVEL: WARN
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/subjects"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
  kafka-ui:
      image: provectuslabs/kafka-ui:latest
      ports: ["8090:8080"]
      depends_on:
        kafka:
          condition: service_healthy
      environment:
        KAFKA_CLUSTERS_0_NAME: nexus
        KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
        KAFKA_CLUSTERS_0_SCHEMAREGISTRY: http://schema-registry:8081
  clickhouse:
    image: clickhouse/clickhouse-server:25.4
    ports: ["8123:8123"]
    environment:
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_REGION: ${AWS_REGION}
    healthcheck:
      test: ["CMD", "clickhouse-client", "--password", "nexus123", "--query", "SELECT 1"]
      interval: 10s
      retries: 5
    volumes:
      - ./clickhouse/s3.xml:/etc/clickhouse-server/config.d/s3.xml
      - ./clickhouse/users.xml:/etc/clickhouse-server/users.d/users.xml

  neo4j:
    image: neo4j:5.18
    ports: ["7474:7474", "7687:7687"]
    environment:
      NEO4J_AUTH: neo4j/devpassword
      NEO4J_PLUGINS: '["apoc","graph-data-science"]'
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "devpassword", "RETURN 1"]
      interval: 15s
      retries: 5

  superset:
    image: apache/superset:pr-40078-d9f04d6-ci
    platform: linux/amd64 
    ports: ["8088:8088"]
    user: root
    environment:
      SUPERSET_SECRET_KEY: "any-long-random-string"
    entrypoint: >
      /bin/sh -c "
      uv pip install  --no-cache clickhouse-connect &&
      pip install psycopg2-binary &&
      superset db upgrade &&
      superset init &&
      superset fab create-admin --username admin --firstname Superset --lastname Admin --email admin@example.com --password admin &&
      gunicorn -w 2 --timeout 60 -b 0.0.0.0:8088 'superset.app:create_app()'
      "
    # 3. Ensure other services (like ClickHouse) can safely verify when Superset is fully live
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8088/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  spark:
    image: bitnamilegacy/spark:3.5.3 
    platform: linux/amd64 
    depends_on:
      kafka:
        condition: service_healthy
      lakekeeper:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
    user: root 
    environment:
      # 3. Provided default fallbacks ('dev') so your container doesn't crash if your fish shell lacks variables
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-dev_key}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-dev_secret}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-lakekeeper-bucket}
      REGISTRY_URL: http://schema-registry:8081
      CATALOG_URI: http://lakekeeper:8181/catalog
      KAFKA_BROKER: kafka:9092
    volumes:
      - ./spark:/opt/spark-apps
      - spark_ivy:/root/.ivy2        
    command: >
      /opt/bitnami/spark/bin/spark-submit
      --master local[2]
      --packages org.apache.iceberg:iceberg-spark-runtime-3.5_2.12:1.6.1,org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.3,org.apache.spark:spark-avro_2.12:3.5.3,org.apache.hadoop:hadoop-aws:3.3.4,com.amazonaws:aws-java-sdk-bundle:1.12.262
      /opt/spark-apps/streaming_job.py


  producer:
      build:
        context: ./producer
        dockerfile: Dockerfile
      depends_on:
        kafka:
          condition: service_healthy
        schema-registry:
          condition: service_healthy
      environment:
        KAFKA_BROKER: kafka:9092
        REGISTRY_URL: http://schema-registry:8081
        PRODUCE_INTERVAL: "0.5"
      restart: unless-stopped
      logging:
        driver: "json-file"
        options:
          max-size: "10m"
          max-file: "3"

  spark-streaming:
    build:
      context: ./spark
      dockerfile: Dockerfile
    depends_on:
      kafka:
        condition: service_healthy
      lakekeeper:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
      producer:
        condition: service_started
    environment:
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_REGION: ${AWS_REGION}
      S3_BUCKET: ${S3_BUCKET}
      KAFKA_BROKER: kafka:9092
      REGISTRY_URL: http://schema-registry:8081
      CATALOG_URI: http://lakekeeper:8181/catalog
      WAREHOUSE_NAME: nexus
      CHECKPOINT_DIR: /tmp/nexus-checkpoint
    volumes:
      - spark_ivy:/root/.ivy2    # cache JARs between restarts
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"



volumes:
  pg_data:
  spark_ivy:      

